<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP Portal</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#134e4a 100%);font-family:'Segoe UI',Arial,sans-serif;}
  .box{background:#ffffff;border-radius:16px;padding:40px 48px;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px;font-weight:700;}
  h1{margin:0 0 8px;font-size:22px;color:#0f172a;}
  p{color:#64748b;font-size:14px;margin:0 0 20px;line-height:1.6;}
  .btn{display:inline-block;background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff;border:none;padding:12px 28px;border-radius:10px;font-size:15px;cursor:pointer;text-decoration:none;font-weight:600;box-shadow:0 6px 18px rgba(13,148,136,.35);}
  .btn:hover{filter:brightness(1.05);}
  .spinner{width:36px;height:36px;border:4px solid #e2e8f0;border-top-color:#0d9488;border-radius:50%;margin:0 auto 16px;animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hint{font-size:12px;color:#94a3b8;margin-top:20px;}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">M</div>
    <h1>MSP Portal</h1>
    <p id="msg">Portal khol rahe hain... thoda sa ruk jao.</p>
    <div class="spinner" id="spinner"></div>
    <button class="btn" id="goBtn" style="display:none;" onclick="go()">Portal Kholen</button>
    <div class="hint">Agar page khud na khule, button dabao.</div>
  </div>

<script>
  // ============================================================
  //  YAHAN TARGET LINK BADLO — BAS YEH EK LINE EDIT KARO
  //  Jab bhi GAS link badle, sirf is URL ko update karo.
  // ============================================================
  var TARGET_URL = 'https://script.google.com/macros/s/AKfycbzJchfY3MtTnalgwEsyVXXoFikHyGSDmLH87R-9QYYES7FRoc5DneOCqupwUGLGBVJczw/exec?page=login';
  // ============================================================

  function getTarget() {
    // QR/scan se aaye query params (cid) pass hote hain:
    // sirf valid params bhejo (cid, lang), baaki chhodo
    var cur = window.location.href;
    var qi = cur.indexOf('?');
    var q = '';
    if (qi >= 0) {
      var parts = cur.substring(qi + 1).split('&');
      var keep = [];
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        if (p.indexOf('cid=') === 0 || p.indexOf('lang=') === 0) { keep.push(p); }
      }
      if (keep.length) q = (TARGET_URL.indexOf('?') >= 0 ? '&' : '?') + keep.join('&');
    }
    return TARGET_URL + q;
  }

  function go() { window.location.replace(getTarget()); }

  window.addEventListener('DOMContentLoaded', function() {
    var t = getTarget();
    // 0.2 sec baad auto-redirect (fast, spinner ka jhalak)
    setTimeout(go, 200);
    // "button bhi dikhe" taaki internet slow ho to bhi chale
    var b = document.getElementById('goBtn');
    if (b) b.style.display = 'inline-block';
  });
</script>
</body>
</html>
